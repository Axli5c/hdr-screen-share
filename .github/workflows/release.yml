name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        type: string
        required: true
        default: v0.2.5

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Build and test application
        shell: pwsh
        run: ./build.ps1
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)CN=Pyrsys B\.V\.(?:,|$)') { throw 'Untrusted Inno Setup compiler' }
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-compiler'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="' + $compiler + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
      - name: Package ZIP and bilingual installer
        shell: pwsh
        run: |
          ./scripts/package-release.ps1
          ./scripts/build-installer.ps1 -Compiler (Join-Path $env:RUNNER_TEMP 'inno-compiler/ISCC.exe')
      - name: Publish and verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          .venv/Scripts/python.exe tools/publish_release.py --tag $env:RELEASE_TAG --repo $env:RELEASE_REPO
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
