[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdr-screen-share"
version = "0.2.2"
description = "HDR to SDR screen relay for Discord on Windows"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6-Essentials==6.12.0", "numpy==2.5.4", "hdrcapture==0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
