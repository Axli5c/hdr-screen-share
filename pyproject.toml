[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdr-screen-share"
version = "0.2.5"
description = "HDR to SDR screen relay for Discord on Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6-Essentials==6.12.0", "numpy==2.5.4", "hdrcapture==0.3.0"]

[project.urls]
Repository = "https://github.com/Axli5c/hdr-screen-share"
Changelog = "https://github.com/Axli5c/hdr-screen-share/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
